<script type="text/javascript">
    'use strict';

    // The words that name the attributes of the `basic` widgets used to be registered here. They moved to
    // src/Vis/Widgets/Basic/i18n, one file per language, when the widgets themselves became React - see
    // the module there. The words below stay: they are read at runtime, not only while editing.

    $.extend(true, systemDictionary, {
        'Edit note': { en: 'Edit note', de: 'Meldung eingeben', ru: 'Сообщение' },
        Clear: { en: 'Clear', de: 'Löschen', ru: 'Очистить' },
        Ok: { en: 'Ok', de: 'Ok', ru: 'Ok' },
        Cancel: { en: 'Cancel', de: 'Abbrechen', ru: 'Отмена' },
        all: { en: 'all', de: 'Alle', ru: 'Все' },
        'just&nbsp;now': { en: 'just&nbsp;now', de: 'gerade&nbsp;jetzt', ru: 'только&nbsp;что' },
        'for&nbsp;%s&nbsp;min.': { en: 'for&nbsp;%s&nbsp;min.', de: 'vor&nbsp;%s&nbsp;Min.', ru: '%s&nbsp;мин. назад' },
        'for&nbsp;%s&nbsp;hr.&nbsp;and&nbsp;%s&nbsp;min.': {
            en: 'for&nbsp;%s&nbsp;hr.&nbsp;and&nbsp;%s&nbsp;min.',
            de: 'vor&nbsp;%s&nbsp;St.&nbsp;und&nbsp;%s&nbsp;Min.',
            ru: '%s&nbsp;часов&nbsp;и&nbsp;%s&nbsp;мин. назад',
        },
        yesterday: { en: 'yesterday', de: 'gestern', ru: 'вчера' },
        'for&nbsp;%s&nbsp;hours': {
            en: 'for&nbsp;%s&nbsp;hours',
            de: 'vor&nbsp;%s&nbsp;Stunden',
            ru: '%s&nbsp;часов назад',
        },
        'click to create': { en: 'click to create', de: 'klicken um zu erzeugen', ru: 'нажать что бы создать' },
        'This option works only in APP': {
            en: 'This option works only in APP',
            de: 'Funktioniert nur im APP',
            ru: 'Работает только в мобильном приложении',
        },
    });

    vis.binds.container = function (el, view) {
        const $this = $(el);
        if (vis.views[view]) {
            vis.renderView(view, view, true, function (_view) {
                $(`#visview_${_view}`)
                    .appendTo($this)
                    .show();
            });
        }
    };
    vis.binds.basic = {
        isFullScreen: false,
        // used in metro
        state: function (el, oid) {
            const $this = $(el);
            oid = oid || $this.attr('data-oid');
            if (oid) {
                $this.attr('data-ctrl-oid', oid);
            }

            if (!vis.editMode) {
                let moved = false;
                $this
                    .on('click touchend', function (e) {
                        // Protect against two events
                        if (vis.detectBounce(this)) {
                            return;
                        }

                        if (moved) {
                            return;
                        }

                        const oid = $(this).attr('data-ctrl-oid');

                        if ($(this).attr('url-value')) {
                            vis.conn.httpGet($(this).attr('url-value'));
                        }

                        if (oid) {
                            let val = $(this).attr('data-val');
                            if (val === undefined || val === null) {
                                val = false;
                            }
                            if (val === 'true') {
                                val = true;
                            }
                            if (val === 'false') {
                                val = false;
                            }
                            if (parseFloat(val).toString() == val) {
                                val = parseFloat(val);
                            }

                            if (oid) {
                                vis.setValue(oid, val);
                            }
                        }
                    })
                    .on('touchmove', function () {
                        moved = true;
                    })
                    .on('touchstart', function () {
                        moved = false;
                    });
            }
        },
        pressed: null,
        pressedNext: null,
        increment: function (el, minmax, delay, interval) {
            function fInterval($that) {
                vis.binds.basic.pressedNext = true;
                vis.binds.basic.pressed = null;
                const oid = $that.attr('data-oid');
                if (!vis.editMode) {
                    const step = parseFloat($that.attr('data-vis-step'));
                    const tmp = parseFloat(vis.states[oid + '.val']) + step;
                    if (step < 0) {
                        if (tmp >= minmax) {
                            vis.setValue($that.attr('data-oid'), tmp);
                            vis.binds.basic.pressed = _setTimeout(fInterval, interval, $that);
                        }
                    } else {
                        if (tmp <= minmax) {
                            vis.setValue($that.attr('data-oid'), tmp);
                            vis.binds.basic.pressed = _setTimeout(fInterval, interval, $that);
                        }
                    }
                }
            }

            function intervalStart() {
                vis.binds.basic.pressedNext = false;
                const $this = $(this);

                if (vis.binds.basic.pressed) {
                    clearInterval(vis.binds.basic.pressed);
                    vis.binds.basic.pressed = null;
                }

                vis.binds.basic.pressed = setTimeout(fInterval, delay, $this);
            }

            if (!vis.editMode) {
                let moved = false;
                $(el)
                    .on('click touchend', function () {
                        // Protect against two events
                        if (vis.detectBounce(this) || moved) {
                            return;
                        }

                        if (vis.binds.basic.pressed) {
                            clearInterval(vis.binds.basic.pressed);
                            vis.binds.basic.pressed = null;
                        }

                        if (vis.binds.basic.pressedNext) {
                            vis.binds.basic.pressedNext = false;
                            return;
                        }
                        const $this = $(this);
                        const oid = $this.attr('data-oid');
                        const step = parseFloat($this.attr('data-vis-step'));
                        const tmp = parseFloat(vis.states[oid + '.val']) + step;
                        if (step < 0) {
                            if (minmax === undefined || tmp >= minmax) {
                                vis.setValue($this.attr('data-oid'), tmp);
                            }
                        } else {
                            if (minmax === undefined || tmp <= minmax) {
                                vis.setValue($this.attr('data-oid'), tmp);
                            }
                        }
                    })
                    .on('touchmove', function () {
                        moved = true;
                    })
                    .on('touchstart', function () {
                        moved = false;
                    });
            }

            if (interval) {
                $(el)
                    .on('mousedown', intervalStart)
                    .on('touchstart', intervalStart)
                    .on('touchend', function () {
                        if (vis.binds.basic.pressed) {
                            clearInterval(vis.binds.basic.pressed);
                            vis.binds.basic.pressed = null;
                        }
                    })
                    .on('mouseup', function () {
                        if (vis.binds.basic.pressed) {
                            clearInterval(vis.binds.basic.pressed);
                            vis.binds.basic.pressed = null;
                        }
                    })
                    .data('destroy', function (id, $widget) {
                        $widget && $widget.off('mousedown').off('touchstart').off('touchend').off('mouseup');
                    });
            }
        },
        // Used in metro
        navigation: function (el, options) {
            if (!vis.editMode && options.nav_view) {
                const $this = $(el);
                let moved = false;
                $this
                    .on('click touchend', function (e) {
                        // Protect against two events
                        if (vis.detectBounce(this) || moved) {
                            return;
                        }

                        if (options.background) {
                            $('body').css({ background: options.background });
                        }

                        vis.changeView(
                            options.nav_view,
                            options.nav_view,
                            options.hideOptions,
                            options.showOptions,
                            options.sync,
                        );
                        //e.preventDefault();
                        //return false;
                    })
                    .on('touchmove', function () {
                        moved = true;
                    })
                    .on('touchstart', function () {
                        moved = false;
                    });
            }
        },
        _onChange: function (el, oid, wid) {
            const $this = $(el);
            // If still working
            //console.log(oid + ' ' + vis.states.attr(oid + '.val') + ' (' + vis.states.attr(oid + '.ack') + ') - ' + wid + ' ' + vis.states.attr(wid + '.val') + ' (' + vis.states.attr(wid + '.ack') + ')');

            if (wid && vis.states.attr(wid + '.val') === true) {
                return;
            }

            let val = vis.states.attr(oid + '.val');

            if (val === 'false') {
                val = false;
            } else if (val === 'true') {
                val = true;
            } else if (typeof val === 'string') {
                const f = parseFloat(val);
                if (f == val) {
                    val = f;
                } else if (val !== '') {
                    val = true;
                } else {
                    val = false;
                }
            }

            if ($this.data('data-numeric')) {
                $this.prop('checked', val > ($this.data('data-max') - $this.data('data-min')) / 2);
            } else {
                $this.prop('checked', val);
            }
        },
        // used in metro
        checkbox: function (el, numeric, min, max) {
            const $this = $(el);
            const oid = $this.data('oid'); // Object ID
            const wid = $this.data('oid-working'); // Work ID

            function onChange() {
                vis.binds.basic._onChange(el, oid, wid);
            }
            if (oid) {
                const bound = [];
                vis.states.bind(oid + '.val', onChange);
                bound.push(oid + '.val');
                if (wid) {
                    vis.states.bind(wid + '.val', onChange);
                    bound.push(wid + '.val');
                }

                // remember all ids, that bound
                $this
                    .closest('.vis-widget')
                    .data('bound', bound)
                    // remember bind handler
                    .data('bindHandler', onChange);
            }

            if (numeric) {
                if (min !== undefined && min !== null && min !== '') {
                    min = parseFloat(min);
                } else {
                    min = 0;
                }

                if (max !== undefined && max !== null && max !== '') {
                    max = parseFloat(max);
                } else {
                    max = 1;
                }
            } else {
                min = false;
                max = true;
            }

            $this.data('min', min);
            $this.data('max', max);
            $this.data('numeric', numeric);

            vis.binds.basic._onChange(el, oid, wid);

            if (!vis.editMode) {
                $this.change(function () {
                    const $this_ = $(this);
                    if ($this_.prop('checked')) {
                        vis.setValue($this_.data('oid'), $this_.data('max'));
                    } else {
                        vis.setValue($this_.data('oid'), $this_.data('min'));
                    }
                });
            }
        },
        input: function (el, data) {
            const $this = $(el);
            const oid = $this.data('oid'); // Object ID
            const wid = $this.data('oid-working'); // Work ID

            function onChange(e, val) {
                $this.val(val);
            }

            if (oid) {
                const bound = [oid + '.val'];
                vis.states.bind(oid + '.val', onChange);
                if (wid) {
                    bound.push(wid + '.val');
                    vis.states.bind(wid + '.val', onChange);
                }
                // remember all ids, that bound
                $this
                    .closest('.vis-widget')
                    .data('bound', bound)
                    // remember bind handler
                    .data('bindHandler', onChange);
            }

            if (data.numeric) {
                $this.attr('type', 'number');
                if (data.min !== undefined && data.min !== null && data.min !== '') {
                    data.min = parseFloat(data.min);
                } else {
                    data.min = null;
                }

                if (data.max !== undefined && data.max !== null && data.max !== '') {
                    data.max = parseFloat(data.max);
                } else {
                    data.max = null;
                }
            }

            $this.val(vis.states[oid + '.val'] === undefined ? '' : vis.states[oid + '.val']);

            setTimeout(function () {
                $this.css('text-align', $this.parent().parent().css('text-align'));
                $this.css('color', $this.parent().parent().css('color'));
                $this.css('background', $this.parent().parent().css('background'));
                $this.css('border', '0');
                $this.css('text-font', $this.parent().parent().css('text-font'));
            }, 0);

            if (!vis.editMode) {
                $this.change(function () {
                    const $this_ = $(this);
                    if (data.numeric) {
                        let value = parseFloat($this_.val());
                        if (data.min !== null && value < data.min) {
                            value = data.min;
                            $this_.val(value);
                        } else if (data.max !== null && value > data.max) {
                            value = data.max;
                            $this_.val(value);
                        }
                        vis.setValue($this_.data('oid'), value);
                    } else {
                        vis.setValue($this_.data('oid'), $this_.val());
                    }
                });
                if (data.autoSet) {
                    $this.keyup(function (e) {
                        const timer = $this.data('timer');
                        if (timer) {
                            clearTimeout(timer);
                        }
                        $this.data(
                            'timer',
                            setTimeout(function () {
                                $this.trigger('change');
                            }),
                            1000,
                        );
                    });
                }
            }
        },
        select: function (el, invert) {
            const $this = $(el).prev();
            const oid = $this.attr('data-oid');
            let val = vis.states[oid + '.val'];

            if (val === 'false') {
                val = false;
            } else if (val === 'true') {
                val = true;
            } else if (typeof val === 'string') {
                const f = parseFloat(val);
                if (f == val) {
                    val = f;
                } else if (val !== '') {
                    val = true;
                } else {
                    val = false;
                }
            }

            if (invert) val = !val;

            $this.val(val ? 1 : 0);

            if (!vis.editMode) {
                if (oid !== 'nothing_selected') {
                    $this.change(function () {
                        let val = $this.find('option:selected').val();
                        if (invert) {
                            val = !val;
                        }
                        vis.setValue(oid, val);
                    });
                }
            }
            if (oid !== 'nothing_selected') {
            }
            function onChange(e, newVal, oldVal) {
                if (newVal === 'false') {
                    newVal = false;
                } else if (newVal === 'true') {
                    newVal = true;
                } else if (typeof newVal === 'string') {
                    const f = parseFloat(newVal);
                    if (f == newVal) {
                        newVal = f;
                    } else if (newVal !== '') {
                        newVal = true;
                    } else {
                        newVal = false;
                    }
                }
                if (oldVal === 'false') {
                    oldVal = false;
                } else if (oldVal === 'true') {
                    oldVal = true;
                } else if (typeof oldVal === 'string') {
                    const f = parseFloat(oldVal);
                    if (f == oldVal) {
                        oldVal = f;
                    } else if (oldVal !== '') {
                        oldVal = true;
                    } else {
                        oldVal = false;
                    }
                }

                if (newVal == oldVal) {
                    return;
                }

                if (newVal === 'false' || newVal === false || parseFloat(newVal) === 0) {
                    if ($this.find('option[value="1"]').prop('selected')) {
                        $this.find('option[value="1"]').prop('selected', false);
                        $this.find('option[value="0"]').prop('selected', true);
                        $this.trigger('change');
                    }
                } else {
                    if ($this.find('option[value="0"]').prop('selected')) {
                        $this.find('option[value="0"]').prop('selected', false);
                        $this.find('option[value="1"]').prop('selected', true);
                        $this.trigger('change');
                    }
                }
            }

            if (oid) {
                vis.states.bind(oid + '.val', onChange);
                // remember all ids, that bound
                $this
                    .closest('.vis-widget')
                    .data('bound', [oid + '.val'])
                    // remember bind handler
                    .data('bindHandler', onChange);
            }
        },
        /*pushbutton: function(el, oid) {
            if (!vis.editMode) {
                const $this = $(el);
                oid = oid || $this.data('oid');

                $this.on('mousedown touchstart', function (e) {
                    // Protect against two events
                    if (vis.detectBounce(this)) {
                        return;
                    }

                    vis.setValue(oid, true);
                });
                $this.on('mouseup touchend touchcancel', function (e) {
                    // Protect against two events
                    if (vis.detectBounce(this, true)) {
                        return;
                    }

                    vis.setValue(oid, false);
                });
            }
        },*/
        // used in metro
        toggle: function (el, oid) {
            const $this = $(el);
            oid = oid || $this.data('oid');
            let min = $this.data('min');
            let max = $this.data('max');

            const urlTrue = $this.data('url-true');
            let urlFalse = $this.data('url-false');
            const oidTrue = $this.data('oid-true');
            let oidFalse = $this.data('oid-false');
            let oidTrueVal = $this.data('oid-true-value');
            let oidFalseVal = $this.data('oid-false-value');
            const readOnly = $this.data('read-only');

            if (min === '') {
                min = undefined;
            }
            if (max === '') {
                max = undefined;
            }

            if ((oid || oidTrue || urlTrue) && !vis.editMode && !readOnly) {
                let moved = false;
                $this
                    .on('click touchend', function () {
                        // Protect against two events
                        if (vis.detectBounce(this) || moved) {
                            return;
                        }

                        let val;

                        if (oidTrue || urlTrue) {
                            if (!oidFalse && oidTrue) {
                                oidFalse = oidTrue;
                            }
                            if (!urlFalse && urlTrue) {
                                urlFalse = urlTrue;
                            }

                            if (!oid || oid === 'nothing_selected') {
                                val = !$(this).data('state');
                                // remember state
                                $(this).data('state', val);
                            } else {
                                val = vis.states[oid + '.val'];
                                if (max !== undefined) {
                                    if (max === 'true') max = true;
                                    if (max === 'false') max = false;
                                    if (val === 'true') val = true;
                                    if (val === 'false') val = false;
                                    val = val == max;
                                } else {
                                    val = val === 1 || val === '1' || val === true || val === 'true';
                                }
                                val = !val; // invert
                            }
                            if (min === undefined || min === 'false' || min === null) {
                                min = false;
                            }
                            if (max === undefined || max === 'true' || max === null) {
                                max = true;
                            }

                            if (oidTrue) {
                                if (val) {
                                    if (oidTrueVal === undefined || oidTrueVal === null) {
                                        oidTrueVal = max;
                                    }
                                    if (oidTrueVal === 'false') {
                                        oidTrueVal = false;
                                    }
                                    if (oidTrueVal === 'true') {
                                        oidTrueVal = true;
                                    }
                                    const f = parseFloat(oidTrueVal);
                                    if (f.toString() == oidTrueVal) {
                                        oidTrueVal = f;
                                    }
                                    vis.setValue(oidTrue, oidTrueVal);
                                } else {
                                    if (oidFalseVal === undefined || oidFalseVal === null) {
                                        oidFalseVal = min;
                                    }
                                    if (oidFalseVal === 'false') {
                                        oidFalseVal = false;
                                    }
                                    if (oidFalseVal === 'true') {
                                        oidFalseVal = true;
                                    }
                                    const f = parseFloat(oidFalseVal);
                                    if (f.toString() == oidFalseVal) {
                                        oidFalseVal = f;
                                    }
                                    vis.setValue(oidFalse, oidFalseVal);
                                }
                            }

                            if (urlTrue) {
                                if (val) {
                                    vis.conn.httpGet(urlTrue);
                                } else {
                                    vis.conn.httpGet(urlFalse);
                                }
                            }

                            // show new state
                            if (!oid || oid === 'nothing_selected') {
                                const img = $(this).data('img-class');
                                if (val) {
                                    if ($(this).data('as-button')) $(this).addClass('ui-state-active');
                                    val = $(this).data('img-true');
                                } else {
                                    val = $(this).data('img-false');
                                    if ($(this).data('as-button')) $(this).removeClass('ui-state-active');
                                }
                                $(this)
                                    .find('.' + img)
                                    .attr('src', val);
                            }
                        } else {
                            val = vis.states[oid + '.val'];
                            if (
                                (min === undefined &&
                                    (val === null ||
                                        val === '' ||
                                        val === undefined ||
                                        val === false ||
                                        val === 'false')) ||
                                (min !== undefined && min == val)
                            ) {
                                vis.setValue(oid, max !== undefined ? max : true);
                            } else if (
                                (max === undefined && (val === true || val === 'true')) ||
                                (max !== undefined && val == max)
                            ) {
                                vis.setValue(oid, min !== undefined ? min : false);
                            } else {
                                val = parseFloat(val);
                                if (min !== undefined && max !== undefined) {
                                    if (val >= (max - min) / 2) {
                                        val = min;
                                    } else {
                                        val = max;
                                    }
                                } else {
                                    if (val >= 0.5) {
                                        val = 0;
                                    } else {
                                        val = 1;
                                    }
                                }
                                vis.setValue(oid, val);
                            }
                        }
                    })
                    .on('touchmove', function () {
                        moved = true;
                    })
                    .on('touchstart', function () {
                        moved = false;
                    })
                    .data('destroy', function (id, $widget) {
                        $widget.off('click touchend').off('touchmove').off('touchstart');
                    });
            }
        },
        imgRefresh: function (el, src, refreshInterval, refreshOnWakeUp, refreshOnViewChange, refreshWithNoQuery) {
            let widgetView;
            if (src && typeof src === 'object') {
                widgetView = refreshInterval;
                refreshInterval = src.refreshInterval;
                refreshOnWakeUp = src.refreshOnWakeUp;
                refreshOnViewChange = src.refreshOnViewChange;
                refreshWithNoQuery = src.refreshWithNoQuery;
                src = src.src;
            } else if (refreshInterval && typeof refreshInterval === 'object') {
                widgetView = refreshOnWakeUp;
                refreshInterval = refreshInterval.refreshInterval;
                refreshOnWakeUp = refreshInterval.refreshOnWakeUp;
                refreshOnViewChange = refreshInterval.refreshOnViewChange;
                refreshWithNoQuery = refreshInterval.refreshWithNoQuery;
            }
            refreshOnViewChange = refreshOnViewChange === true || refreshOnViewChange === 'true';
            refreshOnWakeUp = refreshOnWakeUp === true || refreshOnWakeUp === 'true';
            refreshWithNoQuery = refreshWithNoQuery === true || refreshWithNoQuery === 'true';

            if (!vis.editMode && src) {
                const $this = $(el).parent().find('img');
                const wid = $this.attr('id');
                refreshInterval = parseInt(refreshInterval, 10) || 0;

                if (refreshOnViewChange) {
                    widgetView = widgetView || vis.activeView;
                    vis.navChangeCallbacks.push({
                        cb: function (view) {
                            if (view === widgetView) {
                                $this.attr(
                                    'src',
                                    src +
                                        (refreshWithNoQuery
                                            ? ''
                                            : (src.indexOf('?') !== -1 ? '&' : '?') + '_refts=' + Date.now()),
                                );
                            }
                        },
                        id: wid,
                    });
                }
                if (refreshInterval > 0) {
                    setInterval(function () {
                        if ($this.is(':visible')) {
                            const p = $this.parents(':hidden');
                            if (
                                !p.length ||
                                p[0].tagName === 'BODY' ||
                                p[0].id === 'materialdesign-vuetify-container'
                            ) {
                                $this[0].src =
                                    src +
                                    (refreshWithNoQuery
                                        ? ''
                                        : (src.indexOf('?') !== -1 ? '&' : '?') + '_refts=' + Date.now());
                            }
                        }
                    }, refreshInterval);
                }
                if (refreshOnWakeUp) {
                    //console.log("refreshOnWakeUp!");
                    vis.onWakeUp(function () {
                        // TODO this does not work. :(
                        //console.log("wakeup refresh!");
                        $this[0].src =
                            src +
                            (refreshWithNoQuery ? '' : (src.indexOf('?') !== -1 ? '&' : '?') + '_refts=' + Date.now());
                        //console.log($this.attr('src'));
                    }, wid);
                }
            }
        },
        formatFloat: function (data, val) {
            if (vis.editMode && data.attr('test_html') !== undefined && data.attr('test_html') !== '') {
                val = parseFloat(data.attr('test_html'));
            } else if (val === undefined || val === null) {
                val = parseFloat(vis.states.attr(data.oid + '.val'));
            } else {
                val = parseFloat(val);
            }
            if (data.factor !== undefined && data.factor !== '') val = val * parseFloat(data.factor);
            if (data.digits !== undefined && data.digits !== '') val = val.toFixed(parseFloat(data.digits, 10));

            if (data.attr('is_tdp')) {
                val = this.formatValue(
                    val,
                    data.digits ? parseInt(data.digits) : 2,
                    data.attr('is_comma') ? '.,' : ',.',
                );
            } else if (data.attr('is_comma')) {
                val = '' + val;
                val = val.replace('.', ',');
            }

            return val;
        },
        formatValue: function formatValue(value, decimals, _format) {
            if (typeof decimals !== 'number') {
                decimals = 2;
                _format = decimals;
            }
            const format = _format === undefined ? '.,' : _format;
            if (typeof value !== 'number') {
                value = parseFloat(value);
            }
            return isNaN(value)
                ? ''
                : value
                      .toFixed(decimals || 0)
                      .replace(format[0], format[1])
                      .replace(/\B(?=(\d{3})+(?!\d))/g, format[0]);
        },

        formatIntervalHelper: function (value, type) {
            let singular;
            let plural;
            let special24;
            if (vis.language === 'de') {
                if (type === 'seconds') {
                    singular = 'Sekunde';
                    plural = 'Sekunden';
                } else if (type === 'minutes') {
                    singular = 'Minute';
                    plural = 'Minuten';
                } else if (type === 'hours') {
                    singular = 'Stunde';
                    plural = 'Stunden';
                } else if (type === 'days') {
                    singular = 'Tag';
                    plural = 'Tagen';
                }
            } else if (vis.language === 'ru') {
                if (type === 'seconds') {
                    singular = 'секунду';
                    plural = 'секунд';
                    special24 = 'секунды';
                } else if (type === 'minutes') {
                    singular = 'минуту';
                    plural = 'минут';
                    special24 = 'минуты';
                } else if (type === 'hours') {
                    singular = 'час';
                    plural = 'часов';
                    special24 = 'часа';
                } else if (type === 'days') {
                    singular = 'день';
                    plural = 'дней';
                    special24 = 'дня';
                }
            } else {
                if (type === 'seconds') {
                    singular = 'second';
                    plural = 'seconds';
                } else if (type === 'minutes') {
                    singular = 'minute';
                    plural = 'minutes';
                } else if (type === 'hours') {
                    singular = 'hour';
                    plural = 'hours';
                } else if (type === 'days') {
                    singular = 'day';
                    plural = 'days';
                }
            }

            if (value === 1) {
                if (vis.language === 'de') {
                    if (type === 'days') {
                        return 'einem ' + singular;
                    }
                    return 'einer ' + singular;
                }
                if (vis.language === 'ru') {
                    if (type === 'days' || type === 'hours') {
                        return 'один ' + singular;
                    }
                    return 'одну ' + singular;
                }
                return 'one ' + singular;
            }
            if (vis.language === 'de') {
                return value + ' ' + plural;
            }
            if (vis.language === 'ru') {
                const d = value % 10;
                if (d === 1 && value !== 11) {
                    return value + ' ' + singular;
                }
                if (d >= 2 && d <= 4 && (value > 20 || value < 10)) {
                    return value + ' ' + special24;
                }
                return value + ' ' + plural;
            }
            return value + ' ' + plural;
        },
        formatInterval: function (timestamp, isMomentJs) {
            if (isMomentJs && typeof moment !== 'undefined') {
                return moment(new Date(timestamp)).fromNow();
            }
            let diff = Date.now() - timestamp;
            diff = Math.round(diff / 1000);
            let text;
            if (diff <= 60) {
                if (vis.language === 'de') {
                    text = 'vor ' + vis.binds.basic.formatIntervalHelper(diff, 'seconds');
                } else if (vis.language === 'ru') {
                    text = vis.binds.basic.formatIntervalHelper(diff, 'seconds') + ' назад';
                } else {
                    text = vis.binds.basic.formatIntervalHelper(diff, 'seconds') + ' ago';
                }
            } else if (diff < 3600) {
                const m = Math.floor(diff / 60);
                const s = diff - m * 60;
                text = '';
                if (vis.language === 'de') {
                    text = 'vor ' + vis.binds.basic.formatIntervalHelper(m, 'minutes');
                } else if (vis.language === 'ru') {
                    text = vis.binds.basic.formatIntervalHelper(m, 'minutes');
                } else {
                    text = vis.binds.basic.formatIntervalHelper(m, 'minutes');
                }

                if (m < 5) {
                    // add seconds
                    if (vis.language === 'de') {
                        text += ' und ' + vis.binds.basic.formatIntervalHelper(s, 'seconds');
                    } else if (vis.language === 'ru') {
                        text += ' и ' + vis.binds.basic.formatIntervalHelper(s, 'seconds');
                    } else {
                        text += ' and ' + vis.binds.basic.formatIntervalHelper(s, 'seconds');
                    }
                }

                if (vis.language === 'de') {
                    // nothing
                } else if (vis.language === 'ru') {
                    text += ' назад';
                } else {
                    text += ' ago';
                }
            } else if (diff < 3600 * 24) {
                const h = Math.floor(diff / 3600);
                const m = Math.floor((diff - h * 3600) / 60);
                text = '';
                if (vis.language === 'de') {
                    text = 'vor ' + vis.binds.basic.formatIntervalHelper(h, 'hours');
                } else if (vis.language === 'ru') {
                    text = vis.binds.basic.formatIntervalHelper(h, 'hours');
                } else {
                    text = vis.binds.basic.formatIntervalHelper(h, 'hours');
                }

                if (h < 10) {
                    // add seconds
                    if (vis.language === 'de') {
                        text += ' und ' + vis.binds.basic.formatIntervalHelper(m, 'minutes');
                    } else if (vis.language === 'ru') {
                        text += ' и ' + vis.binds.basic.formatIntervalHelper(m, 'minutes');
                    } else {
                        text += ' and ' + vis.binds.basic.formatIntervalHelper(m, 'minutes');
                    }
                }

                if (vis.language === 'de') {
                    // nothing
                } else if (vis.language === 'ru') {
                    text += ' назад';
                } else {
                    text += ' ago';
                }
            } else {
                const d = Math.floor(diff / (3600 * 24));
                const h = Math.floor((diff - d * (3600 * 24)) / 3600);
                text = '';
                if (vis.language === 'de') {
                    text = 'vor ' + vis.binds.basic.formatIntervalHelper(d, 'days');
                } else if (vis.language === 'ru') {
                    text = vis.binds.basic.formatIntervalHelper(d, 'days');
                } else {
                    text = vis.binds.basic.formatIntervalHelper(d, 'days');
                }

                if (d < 3) {
                    // add seconds
                    if (vis.language === 'de') {
                        text += ' und ' + vis.binds.basic.formatIntervalHelper(h, 'hours');
                    } else if (vis.language === 'ru') {
                        text += ' и ' + vis.binds.basic.formatIntervalHelper(h, 'hours');
                    } else {
                        text += ' and ' + vis.binds.basic.formatIntervalHelper(h, 'hours');
                    }
                }

                if (vis.language === 'de') {
                    // nothing
                } else if (vis.language === 'ru') {
                    text += ' назад';
                } else {
                    text += ' ago';
                }
            }
            return text;
        },
        startUpdateInterval: function () {
            if (vis.binds.basic.updateInterval) {
                return;
            }
            vis.binds.basic.updateInterval = setInterval(function () {
                $('.time-interval').each(function () {
                    $(this).html(vis.binds.basic.formatInterval($(this).data('time'), $(this).data('moment')));
                });
            }, 15000);
        },
        formatDate: function (dateObj, format, interval, isMomentJs) {
            if (typeof format === 'boolean') {
                interval = format;
                format = 'auto';
            }

            if (format === 'auto') format = (vis.dateFormat || 'DD.MM.YYYY') + ' hh:mm:ss';

            format = format || vis.dateFormat || 'DD.MM.YYYY';

            if (!dateObj) {
                return '';
            }
            const original = dateObj;
            // a state may deliver the timestamp as string, and "1710500000000" is no date string
            if (typeof dateObj === 'string' && dateObj.trim() && !isNaN(Number(dateObj))) {
                dateObj = Number(dateObj);
            }
            const text = typeof dateObj;
            if (text === 'string') {
                dateObj = new Date(dateObj);
            }
            if (text !== 'object') {
                const i = Number(dateObj);
                // if greater than 2000.01.01 00:00:00
                dateObj = i > 946681200000 ? new Date(i) : new Date(i * 1000);
            }
            if (isNaN(dateObj.getTime())) {
                // show the unparsable value instead of "NaN:NaN:NaN"
                return text === 'string' ? original : '';
            }
            if (interval) {
                vis.binds.basic.startUpdateInterval();
                return (
                    '<span class="time-interval" data-time="' +
                    dateObj.getTime() +
                    '" data-moment="' +
                    (isMomentJs || false) +
                    '">' +
                    vis.binds.basic.formatInterval(dateObj.getTime(), isMomentJs) +
                    '</span>'
                );
            }

            let v;

            // Year
            if (format.indexOf('YYYY') !== -1 || format.indexOf('JJJJ') !== -1 || format.indexOf('ГГГГ') !== -1) {
                v = dateObj.getFullYear();
                format = format.replace('YYYY', v);
                format = format.replace('JJJJ', v);
                format = format.replace('ГГГГ', v);
            } else if (format.indexOf('YY') !== -1 || format.indexOf('JJ') !== -1 || format.indexOf('ГГ') !== -1) {
                v = dateObj.getFullYear() % 100;
                format = format.replace('YY', v);
                format = format.replace('JJ', v);
                format = format.replace('ГГ', v);
            }
            // Month
            if (format.indexOf('MM') !== -1 || format.indexOf('ММ') !== -1) {
                v = dateObj.getMonth() + 1;
                if (v < 10) v = '0' + v;
                format = format.replace('MM', v);
                format = format.replace('ММ', v);
            } else if (format.indexOf('M') !== -1 || format.indexOf('М') !== -1) {
                v = dateObj.getMonth() + 1;
                format = format.replace('M', v);
                format = format.replace('М', v);
            }

            // Day
            if (format.indexOf('DD') !== -1 || format.indexOf('TT') !== -1 || format.indexOf('ДД') !== -1) {
                v = dateObj.getDate();
                if (v < 10) v = '0' + v;
                format = format.replace('DD', v);
                format = format.replace('TT', v);
                format = format.replace('ДД', v);
            } else if (format.indexOf('D') !== -1 || format.indexOf('TT') !== -1 || format.indexOf('Д') !== -1) {
                v = dateObj.getDate();
                format = format.replace('D', v);
                format = format.replace('T', v);
                format = format.replace('Д', v);
            }

            // hours
            if (format.indexOf('hh') !== -1 || format.indexOf('SS') !== -1 || format.indexOf('чч') !== -1) {
                v = dateObj.getHours();
                if (v < 10) v = '0' + v;
                format = format.replace('hh', v);
                format = format.replace('SS', v);
                format = format.replace('чч', v);
            } else if (format.indexOf('h') !== -1 || format.indexOf('S') !== -1 || format.indexOf('ч') !== -1) {
                v = dateObj.getHours();
                format = format.replace('h', v);
                format = format.replace('S', v);
                format = format.replace('ч', v);
            }

            // minutes
            if (format.indexOf('mm') !== -1 || format.indexOf('мм') !== -1) {
                v = dateObj.getMinutes();
                if (v < 10) v = '0' + v;
                format = format.replace('mm', v);
                format = format.replace('мм', v);
            } else if (format.indexOf('m') !== -1 || format.indexOf('м') !== -1) {
                v = dateObj.getMinutes();
                format = format.replace('m', v);
                format = format.replace('v', v);
            }

            // milliseconds
            if (format.indexOf('sss') !== -1 || format.indexOf('ссс') !== -1) {
                v = dateObj.getMilliseconds();
                if (v < 10) {
                    v = '00' + v;
                } else if (v < 100) {
                    v = '0' + v;
                }
                format = format.replace('sss', v);
                format = format.replace('ссс', v);
            }

            // seconds
            if (format.indexOf('ss') !== -1 || format.indexOf('сс') !== -1) {
                v = dateObj.getSeconds();
                if (v < 10) v = '0' + v;
                format = format.replace('ss', v);
                format = format.replace('cc', v);
            } else if (format.indexOf('s') !== -1 || format.indexOf('с') !== -1) {
                v = dateObj.getHours();
                format = format.replace('s', v);
                format = format.replace('с', v);
            }

            return format;
        },
        isFalse: function (val, min, max) {
            if (min !== undefined && min !== null && min !== '') {
                if (val === 'true') {
                    val = true;
                }
                if (val === 'false') {
                    val = false;
                }
                if (max !== undefined && max !== null && max !== '') {
                    if (max === 'false') {
                        max = false;
                    }
                    if (max === 'true') {
                        max = true;
                    }
                    return val != max;
                } else {
                    if (min === 'false') {
                        min = false;
                    }
                    if (min === 'true') {
                        min = true;
                    }
                    return val == min;
                }
            }
            if (
                val === undefined ||
                val === null ||
                val === false ||
                val === 'false' ||
                val === 'FALSE' ||
                val === 'False' ||
                val === 'OFF' ||
                val === 'Off' ||
                val === 'off' ||
                val === ''
            )
                return true;
            if (val === '0' || val === 0) {
                return true;
            }
            const f = parseFloat(val);
            if (f.toString() !== 'NaN') {
                return !f;
            }
            return false;
        },
        toggleFullScreen: function (wid, view, data, style) {
            const $div = $('#' + wid);

            const id = $div.attr('id');
            if (id && id.match(/_removed$/)) {
                return;
            }

            // if nothing found => wait
            if (!$div.length) {
                setTimeout(function () {
                    vis.binds.basic.toggleFullScreen(wid, view, data, style);
                }, 100);
                return;
            }

            const svgOn =
                '<svg viewBox="0 0 24 24" style="display: inline-block; color: rgba(0, 0, 0, 0.87); fill: currentcolor; height: 24px; width: 24px; user-select: none; transition: all 450ms cubic-bezier(0.23, 1, 0.32, 1) 0ms;"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"></path></svg>';
            const svgOff =
                '<svg viewBox="0 0 24 24" style="display: inline-block; color: rgba(0, 0, 0, 0.87); fill: currentcolor; height: 24px; width: 24px; user-select: none; transition: all 450ms cubic-bezier(0.23, 1, 0.32, 1) 0ms;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"></path></svg>';

            if (!vis.editMode) {
                $div.unbind('click').click(function () {
                    if (vis.binds.basic.isFullScreen) {
                        vis.binds.basic.isFullScreen = false;
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        } else if (document.mozCancelFullScreen) {
                            document.mozCancelFullScreen();
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        }
                        $('#' + wid)
                            .find('.vis-fullscreen-icon')
                            .html(svgOn);
                    } else {
                        vis.binds.basic.isFullScreen = true;
                        const element = $('#vis_container')[0];
                        if (element.requestFullscreen) {
                            element.requestFullscreen();
                        } else if (element.mozRequestFullScreen) {
                            element.mozRequestFullScreen();
                        } else if (element.webkitRequestFullscreen) {
                            element.webkitRequestFullscreen();
                        } else if (element.msRequestFullscreen) {
                            element.msRequestFullscreen();
                        }
                        $('#' + wid)
                            .find('.vis-fullscreen-icon')
                            .html(svgOff);
                    }
                });
            }

            $div.find('.vis-fullscreen-icon').html(svgOn);
        },
    };

    $(document).mouseup(function () {
        if (vis?.binds.basic.pressed) {
            clearInterval(vis.binds.basic.pressed);
            vis.binds.basic.pressed = null;
        }
    });

    if (vis.editMode) {
        vis.binds.basic.onOrientation = function (widgetID, view, newId, attr, isCss) {
            const data = vis.views[view].widgets[widgetID].data;
            const style = vis.views[view].widgets[widgetID].style;
            const h = parseInt(style.height, 10);
            const w = parseInt(style.width, 10);

            if (data[attr] === 'vertical') {
                if (h < w) {
                    const t = style.height;
                    style.height = style.width;
                    style.width = t;
                    setTimeout(function () {
                        vis.showWidgetHelper(widgetID, true);
                    }, 0);
                    return ['width', 'height'];
                }
            } else {
                if (w < h) {
                    const t = style.height;
                    style.height = style.width;
                    style.width = t;
                    setTimeout(function () {
                        vis.showWidgetHelper(widgetID, true);
                    }, 0);
                    return ['width', 'height'];
                }
            }
        };
        vis.binds.basic.onAttrChanged = function (widgetID, view, newId, attr, isCss) {
            if (vis.binds.basic.groupTimer) clearTimeout(vis.binds.basic.groupTimer);
            vis.binds.basic.groupTimer = setTimeout(function () {
                vis.inspectWidgets(vis.activeViewDiv, vis.activeView, this.activeWidgets);
            }, 2000);
        };
    }
</script>
