<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 32" width="60" height="32" role="img" aria-label="Timestamp Value">
    <title>Timestamp Value</title>
    <!-- the value itself is a point in time, so the clock stands next to it -->
    <circle cx="13" cy="16" r="9" fill="none" stroke="#0d72b8" stroke-width="2" />
    <path d="M13 10.5 V16 L17 18.5" fill="none" stroke="#0d72b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="26" y="21" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4dabf5">12:30</text>
</svg>
