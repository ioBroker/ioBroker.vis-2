<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="jQuery UI">
    <title>jQuery UI</title>
    <!--
        The set of the styled controls, so the icon is the two everybody knows from it: a button and a
        slider. Square on purpose - the header of a palette group gives an icon 20 by 20 pixels, and the
        widget preview that stood here before was three times as wide as it was high and came out squeezed.
        Two blues of the editor: the darker one carries on a light panel, the lighter one on a dark panel.
    -->
    <rect x="2.4" y="3.6" width="19.2" height="7.6" rx="2.4" fill="#0d72b8" />
    <rect x="2.4" y="16.6" width="19.2" height="2.6" rx="1.3" fill="#0d72b8" opacity="0.45" />
    <circle cx="15.6" cy="17.9" r="4" fill="#4dabf5" />
</svg>
